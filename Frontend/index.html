<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      DEFAULT / HOME-PAGE METADATA ONLY.

      These three tags are what a visitor or a crawler sees before React has
      run, so they describe the home page and nothing else. Every other route
      replaces them from src/seo/routeMeta.js the moment the app mounts.

      `data-seo-ssr="1"` marks a tag as a pre-React default. The SEO component
      in src/components/SEO.jsx removes every element carrying it once the app
      has mounted and declared its own. Without that hand-off /about ends up
      with two canonicals pointing at different URLs, because React 19 appends
      the metadata it renders rather than reconciling it against whatever was
      already sitting in the HTML.

      Do not add the other routes' tags here. Six canonicals in one document is
      worse than none.
    -->
    <title>Genie Media | Digital Marketing Agency in Visakhapatnam</title>

    <meta name="title" content="Genie Media | Digital Marketing Agency in Visakhapatnam">
    <meta data-seo-ssr="1" name="description" content="Genie Media is a digital marketing agency in Visakhapatnam offering SEO, Google Ads, social media marketing, website development and online growth services.">
    <meta name="keywords" content="digital marketing agency in visakhapatnam, digital marketing services near me, affordable seo services in vizag, social media marketing vizag, google ads agency in vizag, website development company in visakhapatnam, best digital marketing agency for small business in vizag, local seo services in visakhapatnam, google my business optimization services india, lead generation services for small business india, ">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <link data-seo-ssr="1" rel="canonical" href="https://geniemedia.in/" />
    <link rel="icon" type="image/png" href="/GenieMedia-Logo.png" />
    <link rel="apple-touch-icon" href="/GenieMedia-Logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Google Analytics (G-H5GFQ5HH50).

      Loaded after the `load` event instead of in <head>. gtag.js pulls ~90 kB
      of third-party JavaScript and executes it on the main thread; running it
      before first paint delayed LCP and inflated Total Blocking Time for no
      benefit, because nothing on the page depends on it.

      Page views are still recorded exactly as before — the queued gtag() calls
      below run the moment the library arrives. requestIdleCallback yields to
      any pending work first, with a setTimeout fallback for Safari.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-H5GFQ5HH50');

      (function loadAnalytics() {
        var loaded = false;
        function inject() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-H5GFQ5HH50';
          document.head.appendChild(s);
        }
        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(inject, { timeout: 3000 });
          } else {
            setTimeout(inject, 1500);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
  </body>
</html>
