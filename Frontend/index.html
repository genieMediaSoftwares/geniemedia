<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="TV7lgY0NjiUrtUvsis_iTwxt3hwtztxF_CYIJ7D3b48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag Manager (GTM-TZLCRWCB), deferred.

         As of 2026-09-28 the published container has no tags. Page views are
         sent by the separate GA4 snippet at the end of <body>, which is the
         site's only analytics; keep it unless a GA4 tag is added to this
         container first, or page views stop being recorded.

         The dataLayer and the standard `gtm.js` start event are set up
         immediately, exactly as Google's snippet does, so the container sees
         the real page-start time. Only the ~110 KiB container download waits
         until the page has loaded and the main thread is idle: fetched in
         <head> it competed with the site's own JavaScript and delayed the
         first render on mobile. Anything pushed to dataLayer before then is
         queued and processed when GTM arrives. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      (function (w, d, id) {
        var loaded = false;
        function inject() {
          if (loaded) return;
          loaded = true;
          var s = d.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtm.js?id=' + id;
          d.head.appendChild(s);
        }
        // `load` can fire before React has rendered the route (the page chunk
        // is preloaded, so its bytes are in before its render finishes), so a
        // short settle period follows it; then the next idle moment.
        function schedule() {
          setTimeout(function () {
            if ('requestIdleCallback' in w) w.requestIdleCallback(inject, { timeout: 2000 });
            else inject();
          }, 1500);
        }
        if (d.readyState === 'complete') schedule();
        else w.addEventListener('load', schedule, { once: true });
      })(window, document, 'GTM-TZLCRWCB');
    </script>
    <!-- End Google Tag Manager -->
    <!--
      DEFAULT / HOME-PAGE METADATA ONLY.

      These three tags are what a visitor or a crawler sees before React has
      run, so they describe the home page and nothing else. Every other route
      replaces them from src/seo/routeMeta.js the moment the app mounts.

      `data-seo-ssr="1"` marks a tag as a pre-React default. The SEO component
      in src/components/SEO.jsx removes every element carrying it once the app
      has mounted and declared its own. Without that hand-off /about ends up
      with two canonicals pointing at different URLs, because React 19 appends
      the metadata it renders rather than reconciling it against whatever was
      already sitting in the HTML.

      Do not add the other routes' tags here. Six canonicals in one document is
      worse than none.
    -->
    <!-- Keep in step with ROUTE_META["/"]; the production build rewrites these
         from that table (vite.config.js, prerenderRouteHeads). -->
    <title>Genie Media, Vizag | Digital Marketing, Podcast & Video Production</title>

    <meta name="title" content="Genie Media, Vizag | Digital Marketing, Podcast & Video Production">
    <meta data-seo-ssr="1" name="description" content="Genie Media & Studio in Visakhapatnam offers digital marketing, SEO, websites, video production and a podcast studio for hire. Book a call or a studio slot.">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">

    <link data-seo-ssr="1" rel="canonical" href="https://geniemedia.in/" />
    <!-- Small square icons generated from GenieMedia-Logo.png. Pointing the
         favicon at the 691x1026, 32 KiB logo itself cost every first visit a
         32 KiB download during page load. The full logo stays for og:image and
         structured data. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f97316" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TZLCRWCB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Google Analytics (G-H5GFQ5HH50).

      Loaded after the `load` event instead of in <head>. gtag.js pulls ~90 kB
      of third-party JavaScript and executes it on the main thread; running it
      before first paint delayed LCP and inflated Total Blocking Time for no
      benefit, because nothing on the page depends on it.

      Page views are still recorded exactly as before — the queued gtag() calls
      below run the moment the library arrives. requestIdleCallback yields to
      any pending work first, with a setTimeout fallback for Safari.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-H5GFQ5HH50');

      (function loadAnalytics() {
        var loaded = false;
        function inject() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-H5GFQ5HH50';
          document.head.appendChild(s);
        }
        // Same timing as GTM above: `load` can fire before React has rendered
        // the route, so wait 1.5s after it, then the next idle moment. Loaded
        // straight after `load`, this 170 KiB script ran during the mobile
        // first render. Visitors who leave within ~2s may not be recorded.
        function schedule() {
          setTimeout(function () {
            if ('requestIdleCallback' in window) {
              requestIdleCallback(inject, { timeout: 2000 });
            } else {
              inject();
            }
          }, 1500);
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
  </body>
</html>
